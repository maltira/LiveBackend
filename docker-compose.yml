services:
  redis:
    container_name: chat-redis
    image: redis:latest
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
  postgres:
    container_name: chat-postgres
    image: postgres:alpine3.22
    restart: unless-stopped
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 12341234
    volumes:
      - postgres_data:/var/lib/postgresql/data
  rabbitmq:
    container_name: chat-rabbitmq
    image: rabbitmq:latest
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
  gateway:
    container_name: chat-gateway
    build:
      context: ./gateway
      dockerfile: Dockerfile
    image: chat-platform/gateway
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./.env:/app/.env
  auth:
    container_name: chat-auth
    build:
      context: ./auth
      dockerfile: Dockerfile
    image: chat-platform/auth
    restart: unless-stopped
    ports:
      - "8001:8001"
    depends_on:
      - redis
      - postgres
      - rabbitmq
    volumes:
      - ./.env:/app/.env
  user:
    container_name: chat-user
    build:
      context: ./user
      dockerfile: Dockerfile
    image: chat-platform/user
    restart: unless-stopped
    ports:
      - "8002:8002"
    depends_on:
      - redis
      - postgres
      - rabbitmq
    volumes:
      - ./.env:/app/.env
  chat:
    container_name: chat-data
    build:
      context: ./chat
      dockerfile: Dockerfile
    image: chat-platform/chat
    restart: unless-stopped
    ports:
      - "8003:8003"
    depends_on:
      - redis
      - postgres
      - rabbitmq
    volumes:
      - ./.env:/app/.env
volumes:
  redis-data:
  postgres_data:
  rabbitmq-data: