services:
  redis:
    container_name: chat-redis
    image: redis:latest
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5
  postgres:
    container_name: chat-postgres
    image: postgres:alpine3.22
    restart: unless-stopped
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 12341234
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 3s
      retries: 5
  rabbitmq:
    container_name: chat-rabbitmq
    image: rabbitmq:latest
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
  gateway:
    container_name: chat-gateway
    build:
      context: ./gateway
      dockerfile: Dockerfile
    image: chat-platform/gateway
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      auth:
        condition: service_started
      user:
        condition: service_started
      chat:
        condition: service_started
    env_file:
      - ./.env
  auth:
    container_name: chat-auth
    build:
      context: ./auth
      dockerfile: Dockerfile
    image: chat-platform/auth
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    env_file:
      - ./.env
  user:
    container_name: chat-user
    build:
      context: ./user
      dockerfile: Dockerfile
    image: chat-platform/user
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    env_file:
      - ./.env
  chat:
    container_name: chat-data
    build:
      context: ./chat
      dockerfile: Dockerfile
    image: chat-platform/chat
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    env_file:
      - ./.env

volumes:
  redis-data:
  postgres_data:
  rabbitmq-data:
